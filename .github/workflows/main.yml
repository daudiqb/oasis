# This is a workflow to test and deploy our demo app.

name: Demo CI/CD

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: pa_deploy

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: '3.13'
          # Optional - x64 or x86 architecture, defaults to x64
          architecture: 'x64'
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Install MongoDB in a Docker container.
        uses: supercharge/mongodb-github-action@1.12.1

      - name: Install Python packages.
        run: make dev_env

      - name: Run Python tests.
        run: make all_tests

      - name: Deploy to PythonAnywhere
        if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          PA_USER: ${{ vars.PA_USER }}
          SSHPASS: ${{ secrets.PA_SSH_PASSWORD }}
        run: |
          : "${PA_USER:?Set PA_USER in GitHub Actions variables}"
          : "${SSHPASS:?Set PA_SSH_PASSWORD in GitHub Actions secrets}"
          sudo apt-get update
          sudo apt-get install -y sshpass

          install -d -m 700 ~/.ssh
          host_key=$(ssh-keyscan -T 10 -t rsa ssh.pythonanywhere.com)
          fingerprint=$(ssh-keygen -E sha256 -lf - <<< "$host_key" | awk '{print $2}')
          if [[ "$fingerprint" != 'SHA256:zy2jmqxNg/fs6tFZK55OjHTI3B2UofzOiUvTPtcX3/Y' ]]; then
            echo "PythonAnywhere SSH host key verification failed." >&2
            exit 1
          fi
          printf '%s\n' "$host_key" >> ~/.ssh/known_hosts
          sshpass -e ./deploy.sh
